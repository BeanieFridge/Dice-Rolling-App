<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="DiceRolling.css">
    <title>Rolling Dice</title>
</head>
<body>
    <div class="container">
    <h1>Roll Your Dice</h1>
        <div class="Column" id="Column1">
            <label>Number of dice:</label>
            <input type="number" id="numDice" value="1" min="1"><br>
            <label>Type of Dice</label>
            <input type="number" id="typeDice" value="2" min="2"><br>
            <button onclick="rollDice()" type="submit" id="submitRoll">Roll</button>
            <h3>You rolled:</h3>
            <div id="diceRolled"></div>
        </div>
    </div>

<script src="DiceRolling.js"></script>
</body>
</html>
